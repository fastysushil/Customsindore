<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Customs Indore</title>
   <!-- Favicon -->
   <link rel="icon" type="images/top-header/customs-logo.png" href="images/top-header/customs-logo.png"> <!-- customs logo -->
  <script crossorigin="anonymous" src="https://kit.fontawesome.com/a076d05399.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="assets/scripts.js" defer></script>
</head>
<body>
  <header><div id="google_translate_element"></div></header>
  <nav></nav>
  <div class="marquee-wrapper">
    <marquee>📢  #FraudAlert-Indian Customs never calls or sends SMS asking for Customs Duty payments to a personal bank account | All official communication from Indian Customs includes a DIN, which can be verified on the CBIC website.</marquee>
  </div>
  <div class="content-wrapper">
    <div class="left-sidebar"></div>
    <main class="main-content">
      <h2 data-i18n="welcome">Welcome to Customs Indore</h2>
      <p data-i18n="central">This is your central working area.</p>
    </main>
    <div class="right-sidebar"></div>
  </div>
  <footer></footer>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const includeHTML = async (selector, file) => {
        const element = document.querySelector(selector);
        if (element) {
          try {
            const response = await fetch(file);
            if (response.ok) {
              element.innerHTML = await response.text();
  
              // Check if the header is loaded and call updateDateTime
              if (file === 'modules/header.html' && typeof updateDateTime === 'function') {
                updateDateTime();
                setInterval(updateDateTime, 1000); // Ensure it updates every second
              }
            } else {
              console.error(`Error loading ${file}: ${response.statusText}`);
              element.innerHTML = `<p>Error loading ${file}</p>`;
            }
          } catch (error) {
            console.error(`Error fetching ${file}:`, error);
            element.innerHTML = `<p>Error fetching ${file}</p>`;
          }
        }
      };
  
      includeHTML('header', 'modules/header.html');
      includeHTML('nav', 'modules/nav.html');
      includeHTML('.left-sidebar', 'modules/left-sidebar.html');
      includeHTML('.right-sidebar', 'modules/right-sidebar.html');
      includeHTML('footer', 'modules/footer.html');
    });
  </script> 
  <script>
    function updateDateTime() {
    const now = new Date();
    const options = {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: true
    };
    document.getElementById('datetime').textContent = now.toLocaleString('en-US', options);
    }
    
    setInterval(updateDateTime, 1000);
    updateDateTime();
    
    // Font size control
    function adjustFontSize(size) {
      const root = document.documentElement;
      if (size === 'small') {
        root.style.setProperty('--base-font-size', '14px');
      } else if (size === 'normal') {
        root.style.setProperty('--base-font-size', '16px');
      } else if (size === 'large') {
        root.style.setProperty('--base-font-size', '18px');
      }
    }
    
    // Calendar popup
    function openCalendarPopup() {
      document.getElementById('calendarModal').style.display = 'block';
    }
    
    function closeCalendarPopup() {
      document.getElementById('calendarModal').style.display = 'none';
    }
    
    // Google Translate
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
    
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
</body>
</html>
