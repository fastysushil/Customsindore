<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004080" />
      <stop offset="100%" stop-color="#001F40" />
    </linearGradient>
    
    <!-- Pattern overlay -->
    <pattern id="overlayPattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    
    <!-- Clippath for the logo circles -->
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="60"/>
    </clipPath>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="200" fill="url(#bgGradient)" />
  
  <!-- Pattern overlay -->
  <rect width="800" height="200" fill="url(#overlayPattern)" />
  
  <!-- Decorative accent bar at top -->
  <rect width="800" height="8" fill="#FFA500" />
  
  <!-- Decorative accent bar at bottom -->
  <rect y="192" width="800" height="8" fill="#FFA500" />
  
  <!-- Left circle for Customs Logo -->
  <g transform="translate(80, 40)">
    <circle cx="60" cy="60" r="60" fill="rgba(255,255,255,0.9)" />
    <!-- This is where you would add your image -->
    <!-- The image will be clipped to the circle -->
    <foreignObject x="0" y="0" width="120" height="120" clip-path="url(#circleClip)">
        <img xmlns="http://www.w3.org/1999/xhtml" src="images/top-header/customs-logo.png" width="100%" height="100%" style="object-fit: contain;" />
      </foreignObject>
  </g>
  
  <!-- Right circle for Ashoka Emblem -->
  <g transform="translate(660, 40)">
    <circle cx="60" cy="60" r="60" fill="rgba(255,255,255,0.9)" />
    <!-- This is where you would add your image -->
    <!-- The image will be clipped to the circle -->
    <!-- For the right circle (Ashoka Emblem) -->
<foreignObject x="0" y="0" width="120" height="120" clip-path="url(#circleClip)">
    <img xmlns="http://www.w3.org/1999/xhtml" src="images/top-header/National-Emblem.png" width="100%" height="90%" style="object-fit: contain;" />
  </foreignObject>
  </g>
  
  <!-- Center text -->
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">Welcome to the official website of</text>
  <text x="400" y="125" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">CUSTOMS INDORE</text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="4" fill="#FFA500" />
  <circle cx="770" cy="30" r="4" fill="#FFA500" />
  <circle cx="30" cy="170" r="4" fill="#FFA500" />
  <circle cx="770" cy="170" r="4" fill="#FFA500" />
</svg>
