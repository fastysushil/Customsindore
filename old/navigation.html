<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customs Indore - Navigation</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f8fc;
    }

    nav {
      background-color: #003366;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-item {
      position: relative;
      padding: 15px 25px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      transition: all 0.3s ease;
    }

    .nav-item:hover {
      background-color: #002244;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #002244;
      flex-direction: column;
      min-width: 200px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 999;
      border-radius: 5px;
    }

    .dropdown .dropdown-item {
      padding: 12px 18px;
      color: white;
      transition: background 0.3s ease;
      border-bottom: 1px solid #003366;
    }

    .dropdown .dropdown-item:hover {
      background-color: #001122;
    }

    .nav-item:hover > .dropdown {
      display: flex;
    }

    .dropdown-submenu {
      position: relative;
    }

    .dropdown-submenu:hover > .dropdown {
      display: flex;
      left: 100%;
      top: 0;
      margin-left: 1px;
    }

    @media (max-width: 768px) {
      nav {
        flex-direction: column;
      }

      .nav-item {
        width: 100%;
        border-bottom: 1px solid #004080;
      }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-item">Home</div>

  <div class="nav-item">
    About Us
    <div class="dropdown">
      <div class="dropdown-item">About Us - 1</div>
      <div class="dropdown-item">About Us - 2</div>
      <div class="dropdown-item">About Us - 3</div>
    </div>
  </div>

  <div class="nav-item">
    Formation
    <div class="dropdown">
      <div class="dropdown-submenu dropdown-item">
        ICD
        <div class="dropdown">
          <div class="dropdown-item">ICD-1</div>
          <div class="dropdown-item">ICD-2</div>
          <div class="dropdown-item">ICD-3</div>
        </div>
      </div>
      <div class="dropdown-submenu dropdown-item">
        Circle
        <div class="dropdown">
          <div class="dropdown-item">Circle-A</div>
          <div class="dropdown-item">Circle-B</div>
          <div class="dropdown-item">Circle-C</div>
        </div>
      </div>
      <div class="dropdown-submenu dropdown-item">
        Airport
        <div class="dropdown">
          <div class="dropdown-item">Airport-A</div>
          <div class="dropdown-item">Airport-B</div>
          <div class="dropdown-item">Airport-C</div>
        </div>
      </div>
    </div>
  </div>

  <div class="nav-item">
    Portal Link
    <div class="dropdown">
      <div class="dropdown-item">Link-1</div>
      <div class="dropdown-item">Link-2</div>
      <div class="dropdown-item">Link-3</div>
    </div>
  </div>
</nav>

</body>
</html>
