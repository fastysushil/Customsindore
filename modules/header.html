    @media screen and (max-width: 1024px) {

    @media screen and (max-width: 768px) {

    .top-bar {
  display: flex;

  align-items: center;

  padding: 6px 12px;

}

.datetime-wrapper {

  left: 50%;

}

#datetime {
  color: white;
  font-weight: bold;
  cursor: pointer;
  text-decoration: underline;
  display: inline-block; /* Ensure it is visible */

}

.top-bar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.top-bar-right button {

  border: none;
  border-radius: 3px;

  cursor: pointer;
}

.top-bar-right button:hover {

.top-bar-right a {

}

.top-bar-right a:hover {
  text-decoration: underline;
}

#google_translate_element {
  margin-left: 10px;
}

@media screen and (max-width: 768px) {
  .top-bar {
    flex-direction: column;
    gap: 5px;
    position: static;
  }

    position: static;
    transform: none;
    text-align: center;
    width: 100%;
  }

  .top-bar-right {
    justify-content: center;
  }
}

/* Calendar Modal Styles */
#calendarModal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.5);
}

#calendarContent {
  position: relative;
  width: 90%;
  max-width: 800px;
  height: 80vh;
  margin: 5% auto;
  background: white;
  border-radius: 8px;
  overflow: hidden;
}

#calendarContent iframe {
  width: 100%;
  height: 100%;
  border: none;
}

#closeBtn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 18px;
  background: #f44336;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
}

<!-- // Live date/time update -->
<script>
function updateDateTime() {
const now = new Date();
const options = {
  weekday: 'long',
  year: 'numeric',
  month: 'long',
  day: 'numeric',
  hour: '2-digit',
  minute: '2-digit',
  second: '2-digit',
  hour12: true
};
document.getElementById('datetime').textContent = now.toLocaleString('en-US', options);
}

setInterval(updateDateTime, 1000);
updateDateTime();

// Font size control
function adjustFontSize(size) {
  const root = document.documentElement;
  if (size === 'small') {
    root.style.setProperty('--base-font-size', '14px');
  } else if (size === 'normal') {
    root.style.setProperty('--base-font-size', '16px');
  } else if (size === 'large') {
    root.style.setProperty('--base-font-size', '18px');
  }
}

// Calendar popup
function openCalendarPopup() {
  document.getElementById('calendarModal').style.display = 'block';
}

function closeCalendarPopup() {
  document.getElementById('calendarModal').style.display = 'none';
}

// Google Translate
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,hi',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}

</script>
